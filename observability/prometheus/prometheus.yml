global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: baas-onboarding
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9001"]
        labels:
          application: baas-onboarding

  - job_name: baas-frauds
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9002"]
        labels:
          application: baas-frauds

  - job_name: baas-account
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9003"]
        labels:
          application: baas-account

  - job_name: baas-webhook
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9004"]
        labels:
          application: baas-webhook
